<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Social{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f5f7; --card: #fff; --text: #1c1e21; --muted: #5f6670; --line: #d9dde3; --accent: #2457c5; --danger: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171a; --card: #1f2227; --text: #e8eaed; --muted: #a4abb5; --line: #363b43; --accent: #8ab0ff; --danger: #ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    nav { display: flex; align-items: center; gap: 16px; max-width: 640px; margin: auto; padding: 12px 16px; }
    nav .brand { font-weight: 700; margin-right: auto; }
    main { max-width: 640px; margin: auto; padding: 24px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    a { color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .meta { color: var(--muted); font-size: .875rem; }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
    .actions { display: flex; gap: 8px; align-items: center; }
    form { margin: 0; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 12px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; }
    textarea { min-height: 96px; resize: vertical; }
    button, .button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--card); cursor: pointer; text-decoration: none; }
    button.secondary, .button.secondary { background: transparent; color: var(--accent); }
    button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .flash { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); margin-bottom: 16px; }
    .flash.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a class="brand" href="{{ url_for('feed') }}">Social</a>
      {% if g.user %}
        <a href="{{ url_for('user_posts', user_id=g.user.userID) }}">{{ g.user.username }}</a>
        <form method="post" action="{{ url_for('logout') }}"><button class="secondary">Log out</button></form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
