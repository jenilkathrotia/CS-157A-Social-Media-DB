{% extends "base.html" %}
{% block title %}Edit post{% endblock %}
{% block content %}
<h1>Edit post</h1>
<form class="card" method="post">
  <label for="content">Post</label>
  <textarea id="content" name="content" maxlength="{{ max_length }}" required>{{ content }}</textarea>
  <div class="actions">
    <button>Save</button>
    <a class="button secondary" href="{{ url_for('feed') }}">Cancel</a>
  </div>
</form>
{% endblock %}
